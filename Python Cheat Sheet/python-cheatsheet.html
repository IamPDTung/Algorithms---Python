<!DOCTYPE html>
<html lang="vi">

<meta charset="UTF-8">

<title>Python Cheat Sheet</title>
<style>
:root {
  --bg: #ffffff;
  --bg-nav: #f8f9fa;
  --text: #212529;
  --text-secondary: #6c757d;
  --border: #dee2e6;
  --code-bg: #f1f3f5;
  --accent: #306998;
  --accent2: #ffd43b;
  --highlight-bg: #fff3cd;
  --highlight-border: #ffc107;
  --card-bg: #ffffff;
  --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
  --section-shadow: 0 1px 4px rgba(0,0,0,0.06);
  --tag-bg: #e7f1fa;
  --tag-color: #306998;
  --transition: 0.3s ease;

  --syn-keyword:   #a626a4;
  --syn-string:    #50a14f;
  --syn-comment:   #a0a1a7;
  --syn-number:    #986801;
  --syn-decorator: #c18401;
  --syn-builtin:   #4078f2;
  --syn-boolean:   #0184bc;
  --syn-self:      #e45649;
  --syn-dunder:    #e45649;
}
[data-theme="dark"] {
  --bg: #1a1a2e;
  --bg-nav: #16213e;
  --text: #e4e6eb;
  --text-secondary: #b0b3b8;
  --border: #3a3b5a;
  --code-bg: #2a2a4a;
  --accent: #5b9bd5;
  --accent2: #ffd43b;
  --highlight-bg: #3d3520;
  --highlight-border: #ffc107;
  --card-bg: #222244;
  --card-shadow: 0 2px 8px rgba(0,0,0,0.3);
  --section-shadow: 0 1px 4px rgba(0,0,0,0.2);
  --tag-bg: #253a5e;
  --tag-color: #5b9bd5;

  --syn-keyword:   #c678dd;
  --syn-string:    #98c379;
  --syn-comment:   #5c6370;
  --syn-number:    #d19a66;
  --syn-decorator: #e5c07b;
  --syn-builtin:   #61afef;
  --syn-boolean:   #56b6c2;
  --syn-self:      #c678dd;
  --syn-dunder:    #e06c75;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  transition: background var(--transition), color var(--transition);
}
nav {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg-nav);
  border-bottom: 1px solid var(--border);
  padding: 10px 24px;
  display: flex; align-items: center; gap: 16px;
  flex-wrap: wrap;
  box-shadow: var(--section-shadow);
  transition: background var(--transition);
}
nav h1 {
  font-size: 1.2rem; color: var(--accent);
  white-space: nowrap;
}
nav .controls {
  display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap;
}
nav .nav-links {
  display: flex; gap: 2px; overflow-x: auto;
  white-space: nowrap; flex: 1; min-width: 0;
  -ms-overflow-style: none; scrollbar-width: none;
}
nav .nav-links::-webkit-scrollbar { display: none; }
nav .nav-links a {
  color: var(--text-secondary); text-decoration: none;
  font-size: 0.78rem; padding: 4px 8px; border-radius: 4px;
  transition: color var(--transition), background var(--transition);
}
nav .nav-links a:hover, nav .nav-links a.active {
  color: var(--accent); background: var(--code-bg);
}
.btn {
  padding: 6px 14px; border: 1px solid var(--border);
  border-radius: 6px; cursor: pointer; font-size: 0.85rem;
  background: var(--card-bg); color: var(--text);
  transition: all var(--transition); white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
main { max-width: 960px; margin: 0 auto; padding: 24px 20px 60px; }
section {
  margin-bottom: 32px;
  background: var(--card-bg);
  border-radius: 10px;
  padding: 24px;
  box-shadow: var(--card-shadow);
  border: 1px solid var(--border);
  transition: background var(--transition), box-shadow var(--transition);
}
section h2 {
  font-size: 1.35rem; margin-bottom: 16px;
  color: var(--accent);
  border-bottom: 2px solid var(--accent2);
  padding-bottom: 6px; display: inline-block;
}
section h3 {
  font-size: 1.05rem; margin: 16px 0 8px;
  color: var(--text);
}
section p, section ul { margin-bottom: 8px; font-size: 0.95rem; }
section ul { padding-left: 20px; }
section ul li { margin-bottom: 4px; }
pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 18px;
  overflow-x: auto;
  font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
  font-size: 0.875rem;
  line-height: 1.55;
  margin: 10px 0;
  transition: background var(--transition);
}
code {
  font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
  font-size: 0.85rem;
}

.syn-keyword  { color: var(--syn-keyword); }
.syn-string   { color: var(--syn-string); }
.syn-comment  { color: var(--syn-comment); font-style: italic; }
.syn-number   { color: var(--syn-number); }
.syn-decorator { color: var(--syn-decorator); }
.syn-builtin  { color: var(--syn-builtin); }
.syn-boolean  { color: var(--syn-boolean); }
.syn-self     { color: var(--syn-self); font-style: italic; }
.syn-dunder   { color: var(--syn-dunder); }

.highlight {
  background: var(--highlight-bg);
  border-left: 4px solid var(--highlight-border);
  padding: 10px 14px; margin: 12px 0;
  border-radius: 0 6px 6px 0; font-size: 0.9rem;
}
.tag {
  display: inline-block;
  background: var(--tag-bg);
  color: var(--tag-color);
  padding: 2px 8px; border-radius: 4px;
  font-size: 0.75rem; font-weight: 600;
  margin: 2px 4px 2px 0;
}
.tag.algo { background: #d4edda; color: #155724; }
[data-theme="dark"] .tag.algo { background: #1e4a2e; color: #7ddf90; }
.intro-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 16px; margin-top: 16px;
}
.intro-card {
  background: var(--code-bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 16px; transition: background var(--transition);
}
.intro-card h3 { font-size: 0.95rem; margin: 0 0 6px; color: var(--accent); }
.intro-card p { font-size: 0.85rem; color: var(--text-secondary); margin: 0; }
footer {
  text-align: center; padding: 20px;
  color: var(--text-secondary); font-size: 0.85rem;
  border-top: 1px solid var(--border);
  transition: border-color var(--transition);
}
details { margin: 10px 0; }
details summary {
  cursor: pointer; font-weight: 600; color: var(--accent);
  padding: 6px 0; user-select: none;
}
details > *:not(summary) { margin-left: 12px; }
.glossary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 12px;
  margin-top: 16px;
}
.glossary-card {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  transition: background var(--transition), border-color var(--transition);
}
.glossary-card:hover { border-color: var(--accent); }
.glossary-term {
  font-weight: 700;
  color: var(--accent);
  font-size: 0.9rem;
  margin-bottom: 6px;
  font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
}
.glossary-def {
  font-size: 0.85rem;
  color: var(--text-secondary);
  line-height: 1.55;
}
.glossary-def code {
  font-size: 0.8rem;
  background: var(--card-bg);
  padding: 1px 5px;
  border-radius: 3px;
}
@media (max-width: 600px) {
  main { padding: 16px 10px 40px; }
  section { padding: 16px; }
  pre { padding: 10px 12px; font-size: 0.8rem; }
  nav { padding: 8px 12px; }
  nav h1 { font-size: 1rem; }
}
</style>
</head>

    { term: 'Type Hint', def: 'Type annotations (Python 3.5+): <code>def f(x: int) -> str:</code>. Does not enforce types at runtime but helps IDE autocomplete, static type checkers (mypy), and documents code more clearly.' },
    { term: 'Pickle / JSON', def: '<strong>pickle</strong>: serializes Python objects to bytes (binary), used for caching, saving ML models. <strong>json</strong>: serializes to JSON strings (text), cross-language compatible. Always prefer JSON for cross-platform needs.' },
    { term: 'import vs from import', def: '<code>import module</code>: imports entire module, accessed via <code>module.name</code>. <code>from module import name</code>: imports directly into namespace, convenient but risks name collisions. Avoid <code>from module import *</code>.' },
    { term: '__name__ == "__main__"', def: 'A guard block that runs code only when the file is executed directly, not when imported. Always place main logic inside this block so the module can be imported safely.' },
    { term: 'DRY / KISS', def: '<strong>DRY</strong>: Don\'t Repeat Yourself – avoid code duplication with functions/modules. <strong>KISS</strong>: Keep It Simple, Stupid – keep code simple and readable. Core principles in Pythonic coding.' },
  ],
};

// ============================================================================
// SYNTAX HIGHLIGHTING
// ============================================================================
function highlightPython(code) {
  let escaped = code
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  const ph = [];
  let idx = 0;

  // 1. Docstrings ("""...""" or '''...''')
  escaped = escaped.replace(/"""[\s\S]*?"""|'''[\s\S]*?'''/g, function(m) {
    ph.push('<span class="syn-string">' + m + '</span>');
    return '\x00PH' + (idx++) + 'PH\x00';
  });

  // 2. Single-line comments (# ...)
  escaped = escaped.replace(/(^|\s)(#[^\n]*)/gm, function(_, sp, comment) {
    ph.push(sp + '<span class="syn-comment">' + comment + '</span>');
    return '\x00PH' + (idx++) + 'PH\x00';
  });

  // 3. Regular strings (f"", b"", r"", "", '')
  escaped = escaped.replace(/[bfru]?"(?:[^"\\\n]|\\.)*"|[bfru]?'(?:[^'\\\n]|\\.)*'/g, function(m) {
    ph.push('<span class="syn-string">' + m + '</span>');
    return '\x00PH' + (idx++) + 'PH\x00';
  });

  // 4. Decorators
  escaped = escaped.replace(/@(\w+)/g, '<span class="syn-decorator">@$1</span>');

  // 5. Keywords
  escaped = escaped.replace(/\b(def|class|return|if|elif|else|for|while|try|except|finally|with|import|from|as|yield|pass|break|continue|raise|in|not|and|or|is|lambda|global|nonlocal|del|assert|async|await)\b/g, '<span class="syn-keyword">$1</span>');

  // 6. Booleans / None
  escaped = escaped.replace(/\b(True|False|None)\b/g, '<span class="syn-boolean">$1</span>');

  // 7. Built-in functions / classes
  escaped = escaped.replace(/\b(print|len|range|type|isinstance|sorted|list|dict|set|tuple|int|float|str|bool|map|filter|reduce|zip|enumerate|any|all|open|super|iter|next|chr|ord|sum|max|min|abs|round|reversed|slice|property|staticmethod|classmethod|hasattr|getattr|setattr|id|hash|repr|callable|issubclass|input|eval|exec|pow|divmod|bin|hex|oct|format|vars|dir|locals|globals|object|memoryview|bytearray|bytes|complex|frozenset|Counter|deque|defaultdict|OrderedDict|heapify|heappush|heappop|nlargest|nsmallest|bisect|bisect_left|bisect_right|insort|permutations|combinations|product|count|cycle|repeat|accumulate|chain|groupby|lru_cache|cmp_to_key|wraps|deepcopy|StopIteration|ZeroDivisionError|ValueError|TypeError|RuntimeError|BaseException|Exception|KeyError|Path|TypeVar|aiofiles)\b/g, '<span class="syn-builtin">$1</span>');

  // 8. self / cls
  escaped = escaped.replace(/\b(self|cls)\b/g, '<span class="syn-self">$1</span>');

  // 9. Dunder methods
  escaped = escaped.replace(/(__\w+__)/g, '<span class="syn-dunder">$1</span>');

  // 10. Numbers
  escaped = escaped.replace(/\b(\d+\.?\d*(?:[eE][+-]?\d+)?)\b/g, '<span class="syn-number">$1</span>');

  // Restore placeholders
  escaped = escaped.replace(/\x00PH(\d+)PH\x00/g, function(_, i) { return ph[parseInt(i)]; });

  return escaped;
}

// ============================================================================
// SECTIONS DEFINITION
// ============================================================================
const sections = [
  { id: 'intro',      dataKey: null,              navKey: 'navIntro'          },
  { id: 'basics',     dataKey: 'basics',          navKey: 'navBasics'         },
  { id: 'functions',  dataKey: 'functions',       navKey: 'navFunctions'      },
  { id: 'data-structures', dataKey: 'data_structures', navKey: 'navDataStructures' },
  { id: 'strings',    dataKey: 'strings',         navKey: 'navStrings'        },
  { id: 'oop',        dataKey: 'oop',             navKey: 'navOOP'            },
  { id: 'comprehensions', dataKey: 'comprehensions', navKey: 'navComprehensions' },
  { id: 'lambda',     dataKey: 'lambda_map',      navKey: 'navLambda'         },
  { id: 'iterators',  dataKey: 'iterators',       navKey: 'navIterators'      },
  { id: 'decorators', dataKey: 'decorators',      navKey: 'navDecorators'     },
  { id: 'modules',    dataKey: 'modules',         navKey: 'navModules'        },
  { id: 'exceptions', dataKey: 'exceptions',      navKey: 'navExceptions'     },
  { id: 'files',      dataKey: 'files',           navKey: 'navFiles'          },
  { id: 'typing',     dataKey: 'typing',          navKey: 'navTyping'         },
  { id: 'async',      dataKey: 'async',           navKey: 'navAsync'          },
  { id: 'algo',       dataKey: 'algo',            navKey: 'navAlgo'           },
  { id: 'misc',       dataKey: 'misc',            navKey: 'navMisc'           },
  { id: 'glossary',   dataKey: 'glossary',        navKey: 'navGlossary'       },
];

// ============================================================================
// RUNTIME
// ============================================================================
let currentLang = 'vi';

function t(key) {
  return langData[currentLang]?.[key] || key;
}

function renderNav() {
  const links = sections.map(function(sec) {
    return '<a href="#' + sec.id + '" data-section="' + sec.id + '">' + t(sec.navKey) + '</a>';
  });
  document.getElementById('nav-links').innerHTML = links.join('');
}

function renderSection(sec) {
  if (!sec.dataKey) return '';
  var d = langData[currentLang][sec.dataKey];
  if (!d) return '';

  var html = '<section id="' + sec.id + '"><h2>' + t('sec' + sec.dataKey.charAt(0).toUpperCase() + sec.dataKey.slice(1)) + '</h2>';

  if (sec.dataKey === 'glossary') {
    html += '<div class="glossary-grid">';
    d.forEach(function(item) {
      html += '<div class="glossary-card">';
      html += '<div class="glossary-term">' + item.term + '</div>';
      html += '<div class="glossary-def">' + item.def + '</div>';
      html += '</div>';
    });
    html += '</div>';
  } else {
    if (d.desc) html += '<p>' + d.desc + '</p>';
    if (d.code) html += '<pre><code>' + highlightPython(d.code) + '</code></pre>';
    if (d.highlights) {
      html += '<div class="highlight"><strong>' + (currentLang === 'vi' ? 'Lưu ý' : 'Notes') + ':</strong><ul style="margin-top:6px;">';
      d.highlights.forEach(function(h) { html += '<li>' + h + '</li>'; });
      html += '</ul></div>';
    }
  }
  html += '</section>';
  return html;
}

function renderAll() {
  var html = '';

  // Intro section
  html += '<section id="intro">';
  html += '<h2>' + t('introTitle') + '</h2>';
  html += '<p>' + t('introText') + '</p>';
  html += '<h3 style="margin-top:20px;">' + t('introWhyTitle') + '</h3>';
  html += '<div class="intro-grid">';
  (langData[currentLang].introWhy || []).forEach(function(c) {
    html += '<div class="intro-card"><h3>' + c.h + '</h3><p>' + c.p + '</p></div>';
  });
  html += '</div>';
  html += '<h3 style="margin-top:20px;">' + t('introFutureTitle') + '</h3>';
  html += '<ul>';
  (langData[currentLang].introFuture || []).forEach(function(item) { html += '<li>' + item + '</li>'; });
  html += '</ul>';
  html += '</section>';

  // Remaining sections
  for (var i = 1; i < sections.length; i++) {
    html += renderSection(sections[i]);
  }

  document.getElementById('content').innerHTML = html;
  document.getElementById('footer').innerHTML = '<p>' + t('footer') + '</p>';
}

function setLang(lang) {
  currentLang = lang;
  document.getElementById('btn-vi').classList.toggle('active', lang === 'vi');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  renderAll();
  renderNav();
  localStorage.setItem('python-cheatsheet-lang', lang);
}

function toggleTheme() {
  var body = document.body;
  var isDark = body.getAttribute('data-theme') === 'dark';
  body.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('btn-theme').textContent = isDark ? '🌙 Dark' : '☀️ Light';
  localStorage.setItem('python-cheatsheet-theme', isDark ? 'light' : 'dark');
}

// Init
(function() {
  renderNav();
  var savedLang = localStorage.getItem('python-cheatsheet-lang');
  if (savedLang === 'en') setLang('en'); else setLang('vi');

  var savedTheme = localStorage.getItem('python-cheatsheet-theme');
  if (savedTheme === 'dark') {
    document.body.setAttribute('data-theme', 'dark');
    document.getElementById('btn-theme').textContent = '☀️ Light';
  }
})();

// Active nav on scroll
window.addEventListener('scroll', function() {
  var links = document.querySelectorAll('.nav-links a');
  var current = '';
  document.querySelectorAll('section[id]').forEach(function(sec) {
    if (sec.getBoundingClientRect().top <= 100) current = sec.id;
  });
  links.forEach(function(a) { a.classList.toggle('active', a.getAttribute('data-section') === current); });
});
</script>
</body>
</html>
